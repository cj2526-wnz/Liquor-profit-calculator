<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181413">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="利润速算">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>进货利润速算</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-soft: #eef3ee;
      --ink: #17211c;
      --muted: #66736b;
      --line: #dbe2dc;
      --accent: #157b63;
      --accent-strong: #0f624f;
      --accent-soft: #dff2eb;
      --amber: #a06000;
      --rose: #b23a48;
      --shadow: 0 22px 52px rgba(24, 18, 16, 0.24);
      --radius: 8px;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang TC", "PingFang SC", "Microsoft JhengHei UI", "Microsoft YaHei UI", "Hiragino Sans GB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(115deg, rgba(255, 235, 201, 0.06) 0 1px, transparent 1px 28px),
        linear-gradient(145deg, rgba(72, 31, 37, 0.46), transparent 34%),
        linear-gradient(230deg, rgba(38, 73, 60, 0.34), transparent 42%),
        linear-gradient(135deg, #171313 0%, #231819 44%, #151d1a 100%);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(12, 11, 10, 0.34), rgba(12, 11, 10, 0.52)),
        url("./wine-background.png") center / cover no-repeat;
      opacity: 0.20;
      filter: saturate(0.78) contrast(1.05);
      pointer-events: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 14px 0 34px;
      position: relative;
      z-index: 1;
    }

    .sr-status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(145deg, #1f302b, #5b2f35 54%, #8f6944);
      color: #f8fff9;
      box-shadow: 0 12px 28px rgba(12, 9, 8, 0.30);
      flex: 0 0 auto;
    }

    .logo svg {
      width: 25px;
      height: 25px;
    }

    h1 {
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.1;
      margin: 0;
      letter-spacing: 0;
      font-weight: 650;
      color: #f8fff9;
    }

    .subtitle {
      margin: 4px 0 0;
      color: rgba(248, 255, 249, 0.72);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 239, 216, 0.22);
      border-radius: 999px;
      background: rgba(255, 246, 232, 0.10);
      color: rgba(248, 255, 249, 0.82);
      font-size: 13px;
      white-space: nowrap;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d19a5b;
      box-shadow: 0 0 0 5px rgba(209, 154, 91, 0.16);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 368px) 1fr;
      gap: 16px;
      align-items: start;
    }

    .market-panel {
      margin-top: 16px;
      padding: 16px 18px 18px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255, 251, 244, 0.94), rgba(244, 232, 219, 0.88) 50%, rgba(231, 238, 231, 0.86)),
        rgba(255, 250, 242, 0.92);
      border: 1px solid rgba(255, 242, 224, 0.58);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 251, 246, 0.74), rgba(246, 231, 216, 0.48) 46%, rgba(74, 35, 39, 0.22) 78%, rgba(32, 64, 54, 0.14)),
        url("./wine-background.png") center / cover no-repeat;
      opacity: 0.36;
      pointer-events: none;
      z-index: 0;
    }

    .controls.panel::before {
      background:
        linear-gradient(150deg, rgba(255, 249, 240, 0.86), rgba(244, 223, 207, 0.56) 46%, rgba(93, 46, 47, 0.22) 78%, rgba(31, 67, 55, 0.14)),
        url("./wine-background.png") left center / cover no-repeat;
      opacity: 0.42;
    }

    .results.panel::before {
      background:
        linear-gradient(135deg, rgba(255, 250, 244, 0.66), rgba(240, 224, 209, 0.42) 44%, rgba(82, 40, 45, 0.20) 72%, rgba(25, 67, 55, 0.20)),
        url("./wine-background.png") center / cover no-repeat;
      opacity: 0.38;
    }

    .panel > * {
      position: relative;
      z-index: 1;
    }

    .controls {
      padding: 16px 18px 18px;
      position: sticky;
      top: 16px;
    }

    .section-title {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.3;
      color: #3c342f;
      font-weight: 640;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: #61574f;
      font-size: 13px;
      font-weight: 520;
    }

    .label-note {
      color: #8b7a70;
      font-weight: 620;
    }

    .money-input {
      position: relative;
      display: block;
      min-height: 46px;
      border: 1px solid rgba(166, 116, 91, 0.24);
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 252, 247, 0.96), rgba(249, 234, 223, 0.84) 54%, rgba(240, 246, 241, 0.76)),
        rgba(255, 249, 242, 0.92);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 10px 20px rgba(64, 35, 29, 0.08);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .money-input:focus-within {
      border-color: #8e4557;
      box-shadow:
        0 0 0 3px rgba(142, 69, 87, 0.13),
        0 12px 24px rgba(64, 35, 29, 0.10);
    }

    .currency-prefix {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #7c3a4b;
      font-size: 15px;
      font-weight: 620;
      line-height: 1;
      opacity: 0.78;
      pointer-events: none;
    }

    select,
    input {
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    select {
      padding: 0 12px;
      color: #435047;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #68756d 50%),
        linear-gradient(135deg, #68756d 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .money-input input {
      width: 100%;
      min-height: 46px;
      padding: 10px 13px 10px 31px;
      font-size: 22px;
      font-weight: 560;
      letter-spacing: 0;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(207, 190, 176, 0.84);
      border-radius: var(--radius);
      background: rgba(241, 231, 222, 0.82);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.66);
    }

    .mode-toggle button {
      min-height: 39px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #665b52;
      font-size: 14px;
      font-weight: 560;
    }

    .mode-toggle button.active {
      background: #fff;
      color: #7c3a4b;
      box-shadow: 0 6px 16px rgba(74, 42, 33, 0.13);
    }

    .unit-toggle {
      grid-template-columns: repeat(3, 1fr);
    }

    .unit-cost-note {
      display: grid;
      gap: 7px;
      margin-top: 8px;
      padding: 10px 11px;
      border: 1px solid rgba(166, 116, 91, 0.24);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.56);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .unit-cost-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .unit-cost-row span {
      min-width: 0;
      color: #675950;
      font-size: 12px;
      font-weight: 560;
    }

    .unit-cost-row strong {
      color: #7c3a4b;
      font-size: 16px;
      font-weight: 680;
      white-space: nowrap;
    }

    .margin-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .margin-preset {
      min-height: 32px;
      border: 1px solid rgba(151, 97, 75, 0.24);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.58);
      color: #665b52;
      font-size: 13px;
      font-weight: 600;
    }

    .margin-preset.active {
      border-color: rgba(124, 58, 75, 0.38);
      background: #7c3a4b;
      color: #fffaf4;
      box-shadow: 0 6px 14px rgba(74, 42, 33, 0.13);
    }

    .slider-panel {
      padding: 12px 13px;
      border: 1px solid rgba(166, 116, 91, 0.30);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255, 250, 243, 0.95), rgba(247, 225, 210, 0.86) 54%, rgba(237, 244, 238, 0.78)),
        rgba(255, 249, 242, 0.90);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        0 12px 24px rgba(64, 35, 29, 0.10);
    }

    .slider-readout {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .slider-readout strong {
      font-size: 28px;
      line-height: 1;
      color: #7c3a4b;
    }

    .slider-readout span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 560;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #8f4658;
      cursor: pointer;
    }

    .help {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .rates {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #cbd7d0;
      border-radius: 999px;
      background: #fff;
      color: #25312a;
      font-size: 13px;
      font-weight: 560;
    }

    .chip button {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      background: #eef2ef;
      color: #607067;
      line-height: 1;
      padding: 0;
    }

    .add-rate {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
    }

    .add-rate input {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 0 12px;
      font-weight: 560;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(21, 123, 99, 0.22);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    .results {
      padding: 18px;
    }

    .hero-metric {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(180px, 0.8fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .metric {
      padding: 18px;
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, #1b1a17, #3a2225 55%, #23392f);
      color: #fff;
      min-width: 0;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 242, 220, 0.12);
    }

    .metric.secondary {
      background: rgba(255, 251, 245, 0.74);
      color: var(--ink);
      border: 1px solid rgba(166, 116, 91, 0.20);
    }

    .metric-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 560;
      margin-bottom: 8px;
    }

    .secondary .metric-label {
      color: var(--muted);
    }

    .metric-value {
      font-size: clamp(26px, 5vw, 44px);
      line-height: 1;
      font-weight: 680;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .metric-note {
      margin-top: 11px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 13px;
    }

    .secondary .metric-note {
      color: var(--muted);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid rgba(166, 116, 91, 0.20);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, 0.78);
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 16px;
      text-align: right;
      border-bottom: 1px solid #edf1ee;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #fbf7f1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
      text-transform: uppercase;
      letter-spacing: 0;
      z-index: 1;
    }

    td {
      font-size: 15px;
      font-weight: 560;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr.highlight td {
      background: var(--accent-soft);
    }

    .rate-pill {
      display: inline-flex;
      align-items: center;
      min-width: 62px;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #edf4f0;
      color: var(--accent-strong);
      font-weight: 680;
    }

    .profit {
      color: var(--accent-strong);
    }

    .loss {
      color: var(--rose);
    }

    .copy-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .market-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .market-title {
      margin: 0;
      color: #3c342f;
      font-size: 15px;
      font-weight: 640;
    }

    .market-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .market-input {
      min-height: 44px;
      border: 1px solid rgba(166, 116, 91, 0.34);
      border-radius: var(--radius);
      padding: 0 13px;
      background:
        linear-gradient(135deg, rgba(255, 250, 243, 0.96), rgba(247, 225, 210, 0.88) 52%, rgba(238, 245, 238, 0.78)),
        rgba(255, 249, 242, 0.92);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.84),
        0 12px 24px rgba(64, 35, 29, 0.10);
      font-weight: 560;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .market-card {
      min-width: 0;
      padding: 13px;
      border: 1px solid rgba(166, 116, 91, 0.24);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
    }

    .market-card strong {
      display: block;
      margin-bottom: 7px;
      color: #2f2925;
      font-size: 14px;
    }

    .market-card span {
      display: block;
      min-height: 18px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .market-form {
      margin: 0;
    }

    .market-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: #2e5f50;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .market-link.disabled {
      pointer-events: none;
      opacity: 0.46;
    }

    .recent-searches {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(166, 116, 91, 0.18);
    }

    .recent-searches.visible {
      display: block;
    }

    .recent-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .recent-label {
      margin: 0;
      color: #61574f;
      font-size: 12px;
      font-weight: 600;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-chip {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      min-height: 32px;
      max-width: 100%;
      border: 1px solid rgba(166, 116, 91, 0.26);
      border-radius: 999px;
      padding: 0 4px 0 11px;
      background: rgba(255, 255, 255, 0.64);
      color: #3c342f;
      font-size: 13px;
      font-weight: 560;
      overflow: hidden;
    }

    .recent-chip-text {
      min-width: 0;
      max-width: 180px;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-remove {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      margin-left: 5px;
      border: 0;
      border-radius: 999px;
      background: rgba(124, 58, 75, 0.08);
      color: #7c3a4b;
      font-size: 16px;
      line-height: 1;
      font-weight: 540;
      flex: 0 0 auto;
    }

    .recent-remove:hover {
      background: rgba(124, 58, 75, 0.16);
    }

    .text-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: #2b3930;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .text-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .text-btn svg {
      width: 17px;
      height: 17px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 360px;
      text-align: center;
      color: rgba(255, 247, 238, 0.76);
      padding: 28px;
      border: 1px solid rgba(255, 238, 220, 0.40);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(26, 22, 20, 0.90), rgba(76, 42, 45, 0.78) 52%, rgba(31, 68, 56, 0.76)),
        url("./wine-background.png") center / cover no-repeat;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 18px 36px rgba(24, 24, 20, 0.22);
    }

    .empty strong {
      display: block;
      color: #fffaf4;
      margin-bottom: 7px;
      font-size: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 14px;
      border-radius: 999px;
      background: #12251f;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(18, 37, 31, 0.22);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      .app {
        width: min(100% - 24px, 680px);
        padding-top: 18px;
      }

      .topbar,
      .workspace,
      .hero-metric,
      .market-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .status {
        width: max-content;
        max-width: 100%;
      }

      .controls {
        position: static;
      }

      .metric-value {
        font-size: 32px;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: calc(100% - 18px);
      }

      .brand {
        align-items: flex-start;
      }

      .logo {
        width: 40px;
        height: 40px;
      }

      .controls,
      .results {
        padding: 14px;
      }

      .money-input {
        min-height: 45px;
      }

      .money-input input {
        min-height: 45px;
        font-size: 22px;
        padding: 10px 12px 10px 30px;
      }

      .copy-row {
        grid-template-columns: 1fr;
      }

      .copy-row {
        display: grid;
      }

      .market-search {
        grid-template-columns: 1fr;
      }

      .margin-presets {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
      }

      .text-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <span class="sr-status" id="liveStatus">就绪</span>
    <section class="workspace">
      <aside class="panel controls" aria-label="计算设置">
        <div class="field">
          <label for="cost">进货价 <span class="label-note">Excl GST</span></label>
          <div class="money-input">
            <span class="currency-prefix">$</span>
            <input id="cost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Excl GST" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label>单位</label>
          <div class="mode-toggle unit-toggle" role="tablist" aria-label="进货单位">
            <button class="active" id="unitBottleBtn" type="button" data-unit="bottle">单瓶</button>
            <button id="unitCase6Btn" type="button" data-unit="case6">6 瓶/箱</button>
            <button id="unitCase12Btn" type="button" data-unit="case12">12 瓶/箱</button>
          </div>
          <div class="unit-cost-note" aria-live="polite">
            <div class="unit-cost-row">
              <span id="unitExclusiveGstLabel">单瓶 Excl GST</span>
              <strong id="unitExclusiveGstText">-</strong>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="marginSlider">目标毛利</label>
          <div class="slider-panel">
            <div class="slider-readout">
              <strong id="targetMarginText">31%</strong>
              <span>滑动调整</span>
            </div>
            <input id="marginSlider" type="range" min="0" max="80" step="0.5" value="31">
            <div class="margin-presets" aria-label="常用毛利率">
              <button class="margin-preset" type="button" data-margin="20">20%</button>
              <button class="margin-preset" type="button" data-margin="22">22%</button>
              <button class="margin-preset" type="button" data-margin="25">25%</button>
              <button class="margin-preset" type="button" data-margin="30">30%</button>
              <button class="margin-preset" type="button" data-margin="35">35%</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="currentPrice">当前卖价 <span class="label-note">Incl GST</span></label>
          <div class="money-input">
            <span class="currency-prefix">$</span>
            <input id="currentPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Incl GST" autocomplete="off">
          </div>
        </div>

      </aside>

      <section class="panel results" aria-label="计算结果">
        <div id="resultContent"></div>
      </section>
    </section>

    <section class="panel market-panel" aria-label="市场价对比">
      <div class="market-head">
        <h2 class="market-title">查市场价</h2>
      </div>
      <form class="market-form" method="get" target="_blank" action="https://bigbarrel.co.nz/en/search">
        <div class="market-search">
          <input class="market-input" id="marketQuery" name="q" type="search" placeholder="输入产品名，比如 Monkey Shoulder 1L" autocomplete="off" required>
        </div>
        <input type="hidden" name="utm_av" value="true">
        <div class="market-grid">
          <article class="market-card">
            <strong>Big Barrel</strong>
            <span>搜索 Big Barrel 价格</span>
            <button class="market-link" type="submit" formaction="https://bigbarrel.co.nz/en/search" formtarget="_blank">搜索</button>
          </article>
          <article class="market-card">
            <strong>Liquorland Jackson Street</strong>
            <span>搜索 Petone 这家店价格</span>
            <button class="market-link" type="submit" formaction="https://www.liquorland.co.nz/search" formtarget="_blank">搜索</button>
          </article>
          <article class="market-card">
            <strong>Super Liquor</strong>
            <span>搜索 Alice Town 价格</span>
            <button class="market-link" type="submit" formaction="https://alicetown.superliquor.co.nz/search" formtarget="_blank">搜索</button>
          </article>
        </div>
      </form>
      <div class="recent-searches" id="recentSearches">
        <div class="recent-head">
          <p class="recent-label">最近搜索</p>
        </div>
        <div class="recent-list" id="recentSearchList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>

  <script>
    const GST_RATE = 15;

    const state = {
      unit: "bottle",
      lastResult: null
    };

    const elements = {
      cost: document.querySelector("#cost"),
      currentPrice: document.querySelector("#currentPrice"),
      unitBottleBtn: document.querySelector("#unitBottleBtn"),
      unitCase6Btn: document.querySelector("#unitCase6Btn"),
      unitCase12Btn: document.querySelector("#unitCase12Btn"),
      unitExclusiveGstLabel: document.querySelector("#unitExclusiveGstLabel"),
      unitExclusiveGstText: document.querySelector("#unitExclusiveGstText"),
      marginSlider: document.querySelector("#marginSlider"),
      marginPresets: Array.from(document.querySelectorAll(".margin-preset")),
      targetMarginText: document.querySelector("#targetMarginText"),
      resultContent: document.querySelector("#resultContent"),
      marketQuery: document.querySelector("#marketQuery"),
      marketForm: document.querySelector(".market-form"),
      recentSearches: document.querySelector("#recentSearches"),
      recentSearchList: document.querySelector("#recentSearchList"),
      liveStatus: document.querySelector("#liveStatus"),
      toast: document.querySelector("#toast")
    };

    const storageKeys = {
      lastSearch: "profitCalculator.lastMarketSearch",
      recentSearches: "profitCalculator.recentMarketSearches"
    };

    function numberValue(input, fallback = 0) {
      const value = Number(input.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function rounded(value) {
      const step = 0.01;
      const precision = step >= 1 ? 0 : String(step).split(".")[1]?.length || 2;
      const normalized = Math.round((value + Number.EPSILON) * 1e10) / 1e10;
      return Number((Math.ceil((normalized - Number.EPSILON) / step) * step).toFixed(precision));
    }

    function formatMoney(value) {
      return `$${new Intl.NumberFormat("en-NZ", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value)}`;
    }

    function gstRate() {
      return GST_RATE;
    }

    function packSize() {
      if (state.unit === "case6") return 6;
      if (state.unit === "case12") return 12;
      return 1;
    }

    function landedUnitCost(inputCostExGst) {
      return (inputCostExGst * (1 + gstRate() / 100)) / packSize();
    }

    function unitExclusiveGstLabel() {
      if (state.unit === "case6") return "6 瓶除后 / 瓶 Excl GST";
      if (state.unit === "case12") return "12 瓶除后 / 瓶 Excl GST";
      return "单瓶 Excl GST";
    }

    function renderUnitExclusiveGst(inputCostExGst) {
      const perBottleExclusiveGst = inputCostExGst > 0 ? inputCostExGst / packSize() : NaN;
      elements.unitExclusiveGstLabel.textContent = unitExclusiveGstLabel();
      elements.unitExclusiveGstText.textContent = Number.isFinite(perBottleExclusiveGst)
        ? formatMoney(perBottleExclusiveGst)
        : "-";
    }

    function formatRate(value) {
      const roundedRate = Math.round(value * 10) / 10;
      return `${Number.isInteger(roundedRate) ? roundedRate : roundedRate.toFixed(1)}%`;
    }

    function salePrice(cost, rate) {
      return rate >= 100 ? NaN : cost / (1 - rate / 100);
    }

    function marginFrom(cost, price) {
      if (!price) return 0;
      return ((price - cost) / price) * 100;
    }

    function readJson(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function writeJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function cleanSearchQuery(value) {
      const query = String(value || "")
        .replace(/^[\s"'`“”‘’.,，。/\\|()[\]{}<>《》【】!?！？:：;；、_-]+/, "")
        .replace(/[\s"'`“”‘’.,，。/\\|()[\]{}<>《》【】!?！？:：;；、_-]+$/, "")
        .replace(/\s+/g, " ")
        .trim();
      return /[\p{L}\p{N}]/u.test(query) ? query : "";
    }

    function uniqueSearches(searches) {
      const seen = new Set();
      const cleaned = [];
      searches.forEach((item) => {
        const query = cleanSearchQuery(item);
        const key = query.toLowerCase();
        if (!query || seen.has(key)) return;
        seen.add(key);
        cleaned.push(query);
      });
      return cleaned.slice(0, 10);
    }

    function renderMarginPresets(targetMargin) {
      elements.marginPresets.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.margin) === Number(targetMargin));
      });
    }

    function recentSearches() {
      const searches = readJson(storageKeys.recentSearches, []);
      return Array.isArray(searches) ? uniqueSearches(searches) : [];
    }

    function saveMarketSearch() {
      const query = cleanSearchQuery(elements.marketQuery.value);
      if (!query) return;
      writeJson(storageKeys.lastSearch, query);
      const nextSearches = uniqueSearches([
        query,
        ...recentSearches().filter((item) => item.toLowerCase() !== query.toLowerCase())
      ]);
      writeJson(storageKeys.recentSearches, nextSearches);
      renderRecentSearches();
    }

    function removeRecentSearch(query) {
      const key = cleanSearchQuery(query).toLowerCase();
      const nextSearches = recentSearches().filter((item) => item.toLowerCase() !== key);
      writeJson(storageKeys.recentSearches, nextSearches);
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const searches = recentSearches();
      writeJson(storageKeys.recentSearches, searches);
      elements.recentSearches.classList.toggle("visible", searches.length > 0);
      elements.recentSearchList.innerHTML = searches.map((query) => `
        <span class="recent-chip">
          <button class="recent-chip-text" type="button" data-query="${escapeHtml(query)}">${escapeHtml(query)}</button>
          <button class="recent-remove" type="button" data-query="${escapeHtml(query)}" aria-label="删除 ${escapeHtml(query)}">×</button>
        </span>
      `).join("");
    }

    function restoreMarketSearch() {
      try {
        const lastSearch = cleanSearchQuery(localStorage.getItem(storageKeys.lastSearch));
        if (lastSearch) {
          elements.marketQuery.value = lastSearch;
          localStorage.setItem(storageKeys.lastSearch, lastSearch);
        } else {
          localStorage.removeItem(storageKeys.lastSearch);
        }
      } catch {}
      renderRecentSearches();
    }

    function renderEmpty() {
      elements.resultContent.innerHTML = `
        <div class="empty">
          <div>
            <strong>输入进货价开始计算</strong>
            <span>$ · Excl GST</span>
          </div>
        </div>
      `;
      state.lastResult = null;
    }

    function renderResults() {
      const inputCostExGst = numberValue(elements.cost);
      const currentPrice = numberValue(elements.currentPrice);
      const targetMargin = numberValue(elements.marginSlider, 31);
      const unitCost = landedUnitCost(inputCostExGst);
      elements.targetMarginText.textContent = formatRate(targetMargin);
      renderMarginPresets(targetMargin);
      renderUnitExclusiveGst(inputCostExGst);

      if (!inputCostExGst || inputCostExGst <= 0) {
        renderEmpty();
        elements.liveStatus.textContent = "等待输入进货价";
        return;
      }

      const rawPrice = salePrice(unitCost, targetMargin);
      const price = Number.isFinite(rawPrice) ? rounded(rawPrice) : NaN;
      const unitProfit = Number.isFinite(price) ? price - unitCost : NaN;
      const actualMargin = Number.isFinite(price) ? marginFrom(unitCost, price) : NaN;
      const currentUnitProfit = currentPrice > 0 ? currentPrice - unitCost : NaN;
      const currentMargin = currentPrice > 0 ? marginFrom(unitCost, currentPrice) : NaN;

      state.lastResult = {
        inputCostExGst,
        targetMargin,
        unitCost,
        price,
        unitProfit,
        actualMargin,
        currentPrice,
        currentUnitProfit,
        currentMargin
      };

      elements.resultContent.innerHTML = `
        <div class="hero-metric">
          <div class="metric">
            <div class="metric-label">
              <span>建议售价</span>
              <span>$</span>
            </div>
            <div class="metric-value">${Number.isFinite(price) ? formatMoney(price) : "不可用"}</div>
            <div class="metric-note">单瓶利润 ${Number.isFinite(unitProfit) ? formatMoney(unitProfit) : "-"}</div>
          </div>
          <div class="metric secondary">
            <div class="metric-label"><span>建议毛利</span><span>实际</span></div>
            <div class="metric-value">${Number.isFinite(actualMargin) ? formatRate(actualMargin) : "-"}</div>
            <div class="metric-note">目标 ${formatRate(targetMargin)}</div>
          </div>
        </div>

        <div class="hero-metric">
          <div class="metric secondary">
            <div class="metric-label"><span>当前毛利</span><span>${currentPrice > 0 ? formatMoney(currentPrice) : "未输入"}</span></div>
            <div class="metric-value">${Number.isFinite(currentMargin) ? formatRate(currentMargin) : "-"}</div>
            <div class="metric-note">${currentPrice > 0 ? `单瓶利润 ${formatMoney(currentUnitProfit)}` : "填当前卖价后显示"}</div>
          </div>
          <div class="metric secondary">
            <div class="metric-label"><span>差价</span><span>当前 - 建议</span></div>
            <div class="metric-value">${currentPrice > 0 && Number.isFinite(price) ? formatMoney(currentPrice - price) : "-"}</div>
            <div class="metric-note">${currentPrice > 0 && Number.isFinite(price) ? (currentPrice >= price ? "高于建议价" : "低于建议价") : "当前价 - 建议价"}</div>
          </div>
        </div>

        <div class="copy-row">
          <button class="text-btn primary" id="copyResults" type="button">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 8V5.8C8 4.8 8.8 4 9.8 4h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H16M5.8 8h8.4c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H5.8c-1 0-1.8-.8-1.8-1.8V9.8c0-1 .8-1.8 1.8-1.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            复制结果
          </button>
        </div>
      `;

      elements.liveStatus.textContent = `实际毛利率 ${formatRate(actualMargin)}`;
    }

    function setUnit(unit) {
      state.unit = unit;
      elements.unitBottleBtn.classList.toggle("active", unit === "bottle");
      elements.unitCase6Btn.classList.toggle("active", unit === "case6");
      elements.unitCase12Btn.classList.toggle("active", unit === "case12");
      renderResults();
    }

    function copyResults() {
      if (!state.lastResult) return;
      const result = state.lastResult;
      const lines = [
        `进货价：${formatMoney(result.inputCostExGst)} Excl GST，目标毛利：${formatRate(result.targetMargin)}，建议价毛利：${formatRate(result.actualMargin)}`,
        `建议单瓶售价：${formatMoney(result.price)}，单瓶利润：${formatMoney(result.unitProfit)}`,
        result.currentPrice > 0
          ? `当前卖价：${formatMoney(result.currentPrice)}，当前毛利：${formatRate(result.currentMargin)}，当前单瓶利润：${formatMoney(result.currentUnitProfit)}`
          : "当前卖价：未输入"
      ];
      navigator.clipboard.writeText(lines.join("\n"))
        .then(() => showToast("结果已复制"))
        .catch(() => showToast("复制失败，可手动选中表格"));
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => elements.toast.classList.remove("show"), 1700);
    }

    elements.cost.addEventListener("input", renderResults);
    elements.currentPrice.addEventListener("input", renderResults);
    elements.marginSlider.addEventListener("input", renderResults);
    elements.marginPresets.forEach((button) => {
      button.addEventListener("click", () => {
        elements.marginSlider.value = button.dataset.margin;
        renderResults();
      });
    });
    elements.marketForm.addEventListener("submit", saveMarketSearch);
    elements.recentSearchList.addEventListener("click", (event) => {
      const removeButton = event.target.closest(".recent-remove");
      if (removeButton) {
        removeRecentSearch(removeButton.dataset.query);
        return;
      }

      const searchButton = event.target.closest(".recent-chip-text");
      if (!searchButton) return;
      elements.marketQuery.value = searchButton.dataset.query;
      elements.marketQuery.focus();
    });
    elements.unitBottleBtn.addEventListener("click", () => setUnit("bottle"));
    elements.unitCase6Btn.addEventListener("click", () => setUnit("case6"));
    elements.unitCase12Btn.addEventListener("click", () => setUnit("case12"));

    elements.resultContent.addEventListener("click", (event) => {
      if (event.target.closest("#copyResults")) copyResults();
    });

    restoreMarketSearch();
    renderResults();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
